<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      background:#0d1117;display:flex;align-items:center;
      justify-content:center;height:100vh;
      font-family:'Segoe UI',sans-serif;color:#7d8590;
      user-select:none;
    }
    .wrap{display:flex;flex-direction:column;align-items:center;gap:20px}
    .logo{width:72px;height:72px;border-radius:16px;overflow:hidden}
    .logo img{width:100%;height:100%;object-fit:cover}
    .spinner{
      width:36px;height:36px;
      border:3px solid #2a3140;
      border-top-color:#25d366;
      border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    p{font-size:13px;letter-spacing:.3px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><img src="logo.png" alt="ARX"/></div>
    <div class="spinner"></div>
    <p>Iniciando ARX Send...</p>
  </div>
</body>
</html>
